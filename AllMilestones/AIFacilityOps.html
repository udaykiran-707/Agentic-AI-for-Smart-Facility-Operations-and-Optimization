<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic FacilityOps AI Platform</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --accent-danger: #ef4444;
            --accent-energy: #8b5cf6;
            --accent-maint: #06b6d4;
            --accent-occ: #ec4899;
            --border: #334155;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --sidebar-width: 260px;
            --header-height: 60px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        aside {
            width: var(--sidebar-width);
            background-color: #020617;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            flex-shrink: 0;
            z-index: 20;
            transition: left 0.3s ease;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand span { color: var(--accent-primary); }

        nav ul { list-style: none; }
        nav li { margin-bottom: 0.35rem; }

        .nav-btn {
            width: 100%;
            text-align: left;
            padding: 0.7rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .nav-btn.active { background-color: var(--accent-primary); color: white; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            height: var(--header-height);
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }
        .page-title { font-size: 1.1rem; font-weight: 600; }
        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .header-controls { display: flex; gap: 1rem; align-items: center; }
        .status-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.75rem;
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-success);
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        #content-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
        }

        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--text-muted); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .card-title { font-size: 0.95rem; font-weight: 600; color: var(--text-muted); }

        .metric-value { font-size: 2rem; font-weight: 700; margin-bottom: 0.35rem; }
        .metric-delta { font-size: 0.85rem; color: var(--text-muted); }
        .text-up { color: var(--accent-success); }
        .text-down { color: var(--accent-danger); }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--accent-primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-sm { font-size: 0.8rem; padding: 0.35rem 0.75rem; }
        .btn-danger { background-color: var(--accent-danger); color: white; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--text-muted); padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }
        .bg-green { background: rgba(16, 185, 129, 0.2); color: var(--accent-success); }
        .bg-orange { background: rgba(245, 158, 11, 0.2); color: var(--accent-warning); }
        .bg-red { background: rgba(239, 68, 68, 0.2); color: var(--accent-danger); }
        .bg-blue { background: rgba(59, 130, 246, 0.2); color: var(--accent-primary); }

        .milestone-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .ms-card {
            background: linear-gradient(145deg, var(--bg-card), #151e2e);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.75rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        .ms-card:hover { transform: translateY(-4px); border-color: var(--accent-primary); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .ms-icon { font-size: 2.2rem; margin-bottom: 0.75rem; display: block; }
        .ms-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .ms-desc { color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.4; font-size: 0.9rem; flex: 1; }

        .agent-flow {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding: 0.75rem 1rem;
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            align-items: center;
            font-size: 0.85rem;
            overflow-x: auto;
        }
        .flow-step {
            padding: 0.3rem 0.7rem;
            border-radius: 4px;
            background: var(--bg-hover);
            color: var(--text-muted);
            white-space: nowrap;
        }
        .flow-step.active {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .chart-container {
            width: 100%;
            height: 200px;
            position: relative;
            margin-top: 0.5rem;
        }
        .chart-svg { width: 100%; height: 100%; overflow: visible; display: block; }
        .chart-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .chart-area { stroke: none; opacity: 0.25; }
        .chart-dot { fill: var(--bg-card); stroke-width: 2; r: 4; transition: r 0.2s; }
        .chart-dot:hover { r: 6; cursor: pointer; }

        .recommendation-card {
            border-left: 4px solid var(--accent-warning);
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.07), transparent);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 8px 8px 0;
        }
        .rec-header { display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.95rem; }
        .rec-impact { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }

        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--bg-card);
            border-left: 4px solid var(--accent-primary);
            padding: 0.9rem 1.2rem;
            border-radius: 6px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            min-width: 280px;
            animation: slideIn 0.3s ease-out;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            border-left-width: 4px;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal {
            background: var(--bg-card); width: 480px; max-width: 92%;
            border-radius: 12px; padding: 1.75rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: var(--text-muted); }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 0.65rem 0.8rem;
            background: var(--bg-dark); border: 1px solid var(--border);
            color: var(--text-main); border-radius: 6px; font-family: inherit; font-size: 0.9rem;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent-primary); }

        .flex-row { display: flex; gap: 1rem; }
        .flex-col { display: flex; flex-direction: column; gap: 1rem; }
        .w-full { width: 100%; }

        .heat-high { background: rgba(239, 68, 68, 0.7); }
        .heat-med { background: rgba(245, 158, 11, 0.7); }
        .heat-low { background: rgba(16, 185, 129, 0.7); }

        .sidebar-backdrop {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 15;
        }
        .sidebar-backdrop.active { display: block; }

        @media (max-width: 768px) {
            aside { position: fixed; left: -100%; height: 100%; }
            aside.mobile-open { left: 0; }
            .menu-toggle { display: block; }
            #content-area { padding: 1rem; }
        }
    </style>
</head>
<body>

<div id="app">
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar(false)"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="brand">
            <span>⚡</span> FacilityOps AI
        </div>
        <nav>
            <ul>
                <li><button class="nav-btn active" data-page="home" onclick="router('home')">Home</button></li>
                <li><button class="nav-btn" data-page="overview" onclick="router('overview')">Overview</button></li>
                <li style="margin-top: 1rem; padding-left: 0.75rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Milestones</li>
                <li><button class="nav-btn" data-page="milestone1" onclick="router('milestone1')">M1: Energy</button></li>
                <li><button class="nav-btn" data-page="milestone2" onclick="router('milestone2')">M2: Predictive Maint.</button></li>
                <li><button class="nav-btn" data-page="milestone3" onclick="router('milestone3')">M3: Occ. & Security</button></li>
                <li style="margin-top: 1rem; padding-left: 0.75rem; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Intelligence</li>
                <li><button class="nav-btn" data-page="intelligence" onclick="router('intelligence')">Facility Intelligence</button></li>
                <li><button class="nav-btn" data-page="alerts" onclick="router('alerts')">Alerts</button></li>
                <li><button class="nav-btn" data-page="reports" onclick="router('reports')">Reports</button></li>
            </ul>
        </nav>
    </aside>

    <main>
        <header>
            <div class="header-left">
                <button class="menu-toggle" onclick="toggleMobileSidebar(true)" aria-label="Open navigation">☰</button>
                <div class="page-title" id="page-title">Dashboard</div>
            </div>
            <div class="header-controls">
                <div id="agent-status" class="status-badge">AI Agents Active</div>
                <div class="user-profile" style="width: 32px; height: 32px; background: var(--bg-hover); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">👤</div>
            </div>
        </header>

        <div id="content-area"></div>
    </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="workOrderModal" onclick="handleBackdropClick(event)">
    <div class="modal">
        <h3 style="margin-bottom: 1.25rem;">Create Maintenance Work Order</h3>
        <form id="workOrderForm" onsubmit="handleWorkOrderSubmit(event)">
            <div class="form-group">
                <label for="wo-asset">Asset</label>
                <select class="form-select" id="wo-asset" required></select>
            </div>
            <div class="form-group">
                <label for="wo-desc">Issue Description</label>
                <textarea class="form-textarea" id="wo-desc" rows="3" placeholder="Describe abnormal vibration, noise, or leak..." required></textarea>
            </div>
            <div class="flex-row">
                <div class="form-group w-full">
                    <label for="wo-priority">Priority</label>
                    <select class="form-select" id="wo-priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>
                <div class="form-group w-full">
                    <label for="wo-tech">Assigned To</label>
                    <input type="text" class="form-input" id="wo-tech" value="Tech Team A" required>
                </div>
            </div>
            <div class="flex-row" style="margin-top: 1rem; justify-content: flex-end;">
                <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Order</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
/**
 * AGENTIC FACILITY OPS AI PLATFORM
 */

// 1. Data Store & State
const facilityData = {
    name: "TechPark Corporate Campus",
    buildings: ['Building A', 'Building B', 'Building C'],
    assets: [
        { id: 'hvac-01', name: 'HVAC Unit 01', type: 'HVAC', building: 'Building A', health: 92, vibration: 2.1, temp: 65 },
        { id: 'hvac-02', name: 'HVAC Unit 02', type: 'HVAC', building: 'Building B', health: 61, vibration: 4.5, temp: 78 },
        { id: 'chiller-01', name: 'Chiller 01', type: 'Chiller', building: 'Building C', health: 38, vibration: 8.2, temp: 95 },
        { id: 'ahu-01', name: 'AHU 01', type: 'AHU', building: 'Building A', health: 88, vibration: 1.5, temp: 62 },
        { id: 'gen-01', name: 'Generator 01', type: 'Power', building: 'Building B', health: 95, vibration: 1.2, temp: 55 },
        { id: 'elev-01', name: 'Elevator 01', type: 'Lift', building: 'Building A', health: 85, vibration: 2.0, temp: 60 },
        { id: 'light-a', name: 'Lighting Zone A', type: 'Lighting', building: 'Building A', health: 98, vibration: 0, temp: 25 },
        { id: 'pump-01', name: 'Water Pump 01', type: 'Utility', building: 'Building C', health: 70, vibration: 3.2, temp: 70 }
    ],
    energy: {
        currentLoad: 450,
        todayUsage: 3200,
        monthlyCost: 450000,
        efficiencyScore: 82,
        history: Array.from({ length: 20 }, () => 380 + Math.floor(Math.random() * 80))
    },
    occupancy: {
        current: 342,
        capacity: 600,
        buildingA: 120,
        buildingB: 85,
        buildingC: 137
    },
    security: {
        eventsToday: 142,
        unauthorized: 2,
        riskScore: 86
    },
    alerts: [
        { id: 1, agent: 'Maintenance', msg: 'Chiller 01 vibration exceeds 8.0 mm/s.', severity: 'Critical', time: '09:40 AM', status: 'New' },
        { id: 2, agent: 'Energy', msg: 'Building B baseline power higher than expected for current occupancy.', severity: 'High', time: '10:15 AM', status: 'New' }
    ],
    workOrders: [
        { id: 101, asset: 'HVAC Unit 02', issue: 'Filter Clogging and airflow restriction', priority: 'High', status: 'Pending' }
    ]
};

let currentPage = 'home';

// 2. Utility Functions
function formatCurrency(num) {
    return '₹' + Math.round(num).toLocaleString('en-IN');
}

function generateId() {
    return Math.floor(1000 + Math.random() * 9000);
}

function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    const color = type === 'error' ? 'var(--accent-danger)' : (type === 'success' ? 'var(--accent-success)' : 'var(--accent-primary)');
    toast.style.borderLeftColor = color;
    toast.innerHTML = `<strong>${type.toUpperCase()}</strong><div style="margin-top:2px;">${message}</div>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(50px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3500);
}

function toggleMobileSidebar(open) {
    const aside = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebarBackdrop');
    if (open) {
        aside.classList.add('mobile-open');
        backdrop.classList.add('active');
    } else {
        aside.classList.remove('mobile-open');
        backdrop.classList.remove('active');
    }
}

// 3. AI Agent Classes
class Agent {
    constructor(name) {
        this.name = name;
        this.state = 'Idle';
    }
    updateState(newState) { this.state = newState; }
}

class EnergyAgent extends Agent {
    simulate() {
        const delta = (Math.random() - 0.48) * 15;
        facilityData.energy.currentLoad = Math.max(120, Math.min(850, facilityData.energy.currentLoad + delta));
        facilityData.energy.todayUsage += (facilityData.energy.currentLoad / 3600) * 2;
        facilityData.energy.history.push(Math.round(facilityData.energy.currentLoad));
        if (facilityData.energy.history.length > 20) facilityData.energy.history.shift();

        if (facilityData.energy.currentLoad > 520 && facilityData.occupancy.current < 200) {
            this.triggerAlert("Unusual energy surge during low building occupancy.", "High");
        }
    }
    triggerAlert(msg, severity) {
        if (!facilityData.alerts.some(a => a.msg === msg)) {
            facilityData.alerts.unshift({
                id: generateId(),
                agent: 'Energy',
                msg,
                severity,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: 'New'
            });
            showToast(`[Energy Agent] ${msg}`, 'error');
        }
    }
}

class MaintenanceAgent extends Agent {
    simulate() {
        facilityData.assets.forEach(asset => {
            if (Math.random() > 0.85) {
                asset.vibration = parseFloat((asset.vibration + (Math.random() * 0.2 - 0.08)).toFixed(2));
                if (asset.vibration < 0.5) asset.vibration = 0.5;
            }
            if (asset.vibration > 4.5) {
                asset.health = Math.max(10, asset.health - 0.1);
            }
            if (asset.health < 45 && Math.random() > 0.92) {
                this.triggerAlert(`Predictive warning: ${asset.name} health degraded to ${Math.floor(asset.health)}%.`, 'Critical');
            }
        });
    }
    triggerAlert(msg, severity) {
        if (!facilityData.alerts.some(a => a.msg === msg)) {
            facilityData.alerts.unshift({
                id: generateId(),
                agent: 'Maintenance',
                msg,
                severity,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: 'New'
            });
            showToast(`[Maintenance Agent] ${msg}`, 'error');
        }
    }
}

class SecurityAgent extends Agent {
    simulate() {
        if (Math.random() > 0.8) {
            facilityData.security.eventsToday++;
            if (Math.random() > 0.92) {
                facilityData.security.unauthorized++;
                this.triggerAlert(`Unauthorized badge tap detected at Security Portal B.`, 'Critical');
            }
        }
    }
    triggerAlert(msg, severity) {
        if (!facilityData.alerts.some(a => a.msg === msg)) {
            facilityData.alerts.unshift({
                id: generateId(),
                agent: 'Security',
                msg,
                severity,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: 'New'
            });
            showToast(`[Security Agent] ${msg}`, 'error');
        }
    }
}

class OccupancyAgent extends Agent {
    simulate() {
        const change = Math.floor((Math.random() - 0.5) * 8);
        facilityData.occupancy.current = Math.max(80, Math.min(facilityData.occupancy.capacity, facilityData.occupancy.current + change));
        facilityData.occupancy.buildingA = Math.round(facilityData.occupancy.current * 0.42);
        facilityData.occupancy.buildingB = Math.round(facilityData.occupancy.current * 0.28);
        facilityData.occupancy.buildingC = facilityData.occupancy.current - facilityData.occupancy.buildingA - facilityData.occupancy.buildingB;
    }
}

const energyAgent = new EnergyAgent("Energy");
const maintAgent = new MaintenanceAgent("Maintenance");
const secAgent = new SecurityAgent("Security");
const occAgent = new OccupancyAgent("Occupancy");

// 4. Visualization Components
function renderLineChart(data, color, elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;

    const width = el.clientWidth || 300;
    const height = el.clientHeight || 180;
    const max = Math.max(...data, 1) * 1.08;
    const min = Math.min(...data) * 0.92;
    const range = (max - min) || 1;
    const step = width / (data.length - 1);

    let pathD = `M 0 ${height - ((data[0] - min) / range * height)}`;
    let areaD = pathD;

    for (let i = 1; i < data.length; i++) {
        const x = i * step;
        const y = Math.max(5, Math.min(height - 5, height - ((data[i] - min) / range * height)));
        pathD += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
        areaD += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    }

    areaD += ` L ${width} ${height} L 0 ${height} Z`;

    let dotsHtml = data.map((val, i) => {
        const x = (i * step).toFixed(1);
        const y = Math.max(5, Math.min(height - 5, height - ((val - min) / range * height))).toFixed(1);
        return `<circle cx="${x}" cy="${y}" class="chart-dot" stroke="${color}" data-val="${val} kW"><title>${val} kW</title></circle>`;
    }).join('');

    el.innerHTML = `
        <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
            <path d="${areaD}" class="chart-area" fill="${color}" />
            <path d="${pathD}" class="chart-line" stroke="${color}" />
            ${dotsHtml}
        </svg>
    `;
}

function renderBarChart(dataMap, elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;
    const values = Object.values(dataMap);
    const max = Math.max(...values, 10);
    
    let html = `<div style="display:flex; align-items:flex-end; height:100%; gap:12px; padding: 0.5rem 0.5rem 1.5rem 0.5rem;">`;
    for (const [key, val] of Object.entries(dataMap)) {
        const pct = Math.round((val / max) * 100);
        html += `
            <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end;">
                <span style="font-size:0.75rem; font-weight:700;">${val}</span>
                <div style="width:100%; height:${pct}%; background:var(--accent-primary); border-radius:4px 4px 0 0; min-height:6px; transition: height 0.4s ease;"></div>
                <span style="font-size:0.75rem; color:var(--text-muted); white-space:nowrap;">${key}</span>
            </div>
        `;
    }
    html += `</div>`;
    el.innerHTML = html;
}

                        <tr>
                            <td>${alert.time}</td>
                            <td><span class="badge bg-blue">${alert.agent}</span></td>
                            <td><span class="badge ${alert.severity === 'Critical' ? 'bg-red' : (alert.severity === 'High' ? 'bg-orange' : 'bg-green')}">${alert.severity}</span></td>
                            <td>${alert.msg}</td>
                            <td><button class="btn btn-sm btn-primary" onclick="dismissAlert(${alert.id})">Resolve</button></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
}

function renderReports() {
    document.getElementById('page-title').innerText = "Operational Intelligence Reports";
    const content = document.getElementById('content-area');
    content.innerHTML = `
        <div class="grid-dashboard" style="grid-template-columns: 2fr 1fr;">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Available Automated Audits</div>
                </div>
                <table>
                    <thead>
                        <tr><th>Report Title</th><th>Cadence</th><th>Agent Author</th><th>Action</th></tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Campus Energy Baseline Audit</td>
                            <td>Daily (Midnight)</td>
                            <td>EnergyAgent</td>
                            <td><button class="btn btn-sm btn-outline" onclick="downloadReport('Energy_Daily_Audit.pdf')">Export PDF</button></td>
                        </tr>
                        <tr>
                            <td>Predictive Equipment Health & MTTF</td>
                            <td>Weekly</td>
                            <td>MaintenanceAgent</td>
                            <td><button class="btn btn-sm btn-outline" onclick="downloadReport('MTTF_Asset_Registry.pdf')">Export PDF</button></td>
                        </tr>
                        <tr>
                            <td>Physical Security & Access Anomalies</td>
                            <td>Realtime (24h Window)</td>
                            <td>SecurityAgent</td>
                            <td><button class="btn btn-sm btn-outline" onclick="downloadReport('Security_Access_Log.pdf')">Export PDF</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Instant Telemetry Dump</div>
                </div>
                <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.4; margin-bottom:1rem;">
                    Download an uncompressed JSON snapshot containing raw sensor arrays, current building loads, and timestamped work orders.
                </p>
                <button class="btn btn-primary" onclick="exportDataJSON()">Export System State (JSON)</button>
            </div>
        </div>
    `;
}

// 6. Controller & Router
function router(page) {
    currentPage = page;
    toggleMobileSidebar(false);

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === page);
    });

    switch(page) {
        case 'home': renderHome(); break;
        case 'overview': renderOverview(); break;
        case 'milestone1': renderMilestone1(); break;
        case 'milestone2': renderMilestone2(); break;
        case 'milestone3': renderMilestone3(); break;
        case 'intelligence': renderIntelligence(); break;
        case 'alerts': renderAlerts(); break;
        case 'reports': renderReports(); break;
        default: renderHome();
    }
}

// 7. Event Handlers & Interactivity
function openWorkOrderModal(assetName) {
    const modal = document.getElementById('workOrderModal');
    const select = document.getElementById('wo-asset');

    select.innerHTML = '';
    facilityData.assets.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = `${a.name} (${a.building})`;
        if (a.name === assetName) opt.selected = true;
        select.appendChild(opt);
    });

    modal.classList.add('open');
}

function closeModal() {
    document.getElementById('workOrderModal').classList.remove('open');
    document.getElementById('workOrderForm').reset();
}

function handleBackdropClick(e) {
    if (e.target.id === 'workOrderModal') closeModal();
}

function handleWorkOrderSubmit(e) {
    e.preventDefault();
    const asset = document.getElementById('wo-asset').value;
    const desc = document.getElementById('wo-desc').value;
    const priority = document.getElementById('wo-priority').value;

    facilityData.workOrders.unshift({
        id: generateId(),
        asset,
        issue: desc,
        priority,
        status: 'Pending'
    });

    closeModal();
    showToast(`Work Order dispatched for ${asset}`, 'success');

    if (currentPage === 'milestone2') {
        renderMilestone2();
    }
}

function applyRecommendation(cardId, message) {
    showToast(message, 'success');
    dismissCard(cardId);
}

function dismissCard(cardId) {
    const el = document.getElementById(cardId);
    if (el) {
        el.style.opacity = '0';
        el.style.transform = 'scale(0.95)';
        el.style.transition = 'all 0.25s ease';
        setTimeout(() => el.remove(), 250);
    }
}

function dismissAlert(id) {
    facilityData.alerts = facilityData.alerts.filter(a => a.id !== id);
    renderAlerts();
    showToast('Alert cleared', 'info');
}

function acknowledgeAll() {
    facilityData.alerts = [];
    renderAlerts();
    showToast('All alerts acknowledged and resolved', 'success');
}

function downloadReport(name = 'Facility_Operations_Report.pdf') {
    showToast(`Compiling and downloading ${name}...`, 'info');
}

function exportDataJSON() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(facilityData, null, 2));
    const dlAnchor = document.createElement('a');
    dlAnchor.setAttribute("href", dataStr);
    dlAnchor.setAttribute("download", `facility_telemetry_${Date.now()}.json`);
    document.body.appendChild(dlAnchor);
    dlAnchor.click();
    dlAnchor.remove();
    showToast('JSON telemetry export downloaded', 'success');
}

// 8. Agent Simulation Loop (Every 2.5s)
setInterval(() => {
    energyAgent.simulate();
    maintAgent.simulate();
    secAgent.simulate();
    occAgent.simulate();

    if (currentPage === 'milestone1') {
        const loadEl = document.getElementById('en-load');
        const usageEl = document.getElementById('en-usage');
        if (loadEl) loadEl.innerText = Math.floor(facilityData.energy.currentLoad) + ' kW';
        if (usageEl) usageEl.innerText = Math.floor(facilityData.energy.todayUsage) + ' kWh';
        renderLineChart(facilityData.energy.history, '#8b5cf6', 'chart-energy-trend');
    } else if (currentPage === 'milestone3') {
        const occEl = document.getElementById('occ-current');
        const secEl = document.getElementById('sec-unauth');
        if (occEl) occEl.innerText = facilityData.occupancy.current;
        if (secEl) secEl.innerText = facilityData.security.unauthorized;
        renderBarChart({
            'Building A': facilityData.occupancy.buildingA,
            'Building B': facilityData.occupancy.buildingB,
            'Building C': facilityData.occupancy.buildingC
        }, 'chart-occ-dist');
    } else if (currentPage === 'overview') {
        const ovLoad = document.getElementById('ov-load');
        const ovOcc = document.getElementById('ov-occ');
        if (ovLoad) ovLoad.innerText = Math.floor(facilityData.energy.currentLoad) + ' kW';
        if (ovOcc) ovOcc.innerText = facilityData.occupancy.current;
        renderLineChart(facilityData.energy.history, '#3b82f6', 'chart-overview-trend');
    }
}, 2500);

// Initialize
router('home');
</script>
</body>
</html>
